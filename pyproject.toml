[project]
name = "neuraldoc"
version = "0.1.0"
description = "NeuralDoc — Intelligent Document Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.23",
  "python-docx>=1.1",
  "sentence-transformers>=2.5",
  "faiss-cpu>=1.8",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "langchain>=0.2",
  "langchain-core>=0.2",
  "langgraph>=0.2",
  "loguru>=0.7",
  "streamlit>=1.33",
  "requests>=2.31",
  "tiktoken>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
